plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlin_version"
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "net.christianbeier.droidvnc_ng"
        minSdk 24
        targetSdk 36
        versionCode 63
        versionName "2.20.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                // specify explicit target list to exclude examples, tests, utils. etc from used libraries
                targets "vncserver", "droidvnc-ng"
            }
        }

        ndk {
            debugSymbolLevel = 'FULL'
        }

    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    namespace 'net.christianbeier.droidvnc_ng'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        buildConfig true
    }
}

// Build-time keysym table (issue #13 configurable shortcuts): rather than hand-maintaining a
// token<->keysym table, generate Keysyms.kt from libvncserver's rfb/keysym.h so key tokens follow
// the established X11 XK_ names. Each keysym becomes a named `const val` field and the byToken /
// tokenFor lookup maps are built from those constants at class-init -- nothing is packed into a
// string or parsed at runtime. The source is registered through the AGP variant API
// (addGeneratedSourceDirectory) so Android Studio lists it under generated sources; it is not
// checked in.
abstract class GenerateKeysyms extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getKeysymHeader()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def pkgDir = new File(outputDir.get().asFile, 'net/christianbeier/droidvnc_ng')
        pkgDir.mkdirs()
        // Parse `#define XK_<Name> 0x<hex>` lines, keeping header order and the first of any
        // duplicate macro name.
        def entries = []
        def seen = new HashSet<String>()
        keysymHeader.get().asFile.eachLine('UTF-8') { line ->
            def m = (line =~ /^#define\s+XK_(\w+)\s+0x([0-9A-Fa-f]+)\b/)
            if (m && seen.add(m[0][1])) {
                entries << [name: m[0][1], hex: m[0][2]]
            }
        }
        int chunkSize = 300 // keep each addN() well under the 64KB JVM method-bytecode limit
        int chunks = (int) Math.ceil(entries.size() / (double) chunkSize)
        int cap = (int) (entries.size() / 0.7) + 1

        def sb = new StringBuilder()
        sb << '/* Generated from libvncserver rfb/keysym.h -- do not edit. */\n'
        sb << 'package net.christianbeier.droidvnc_ng\n\n'
        sb << '/**\n'
        sb << " * Name<->keysym table generated at build time from libvncserver's rfb/keysym.h, so key\n"
        sb << ' * tokens follow the established X11 XK_ names rather than a hand-maintained list. Each keysym\n'
        sb << ' * is a named XK_-prefixed constant; [byToken] and [tokenFor] are built from those constants\n'
        sb << ' * at class-init -- nothing is packed into a string or parsed at runtime. [byToken] keys are\n'
        sb << ' * lower-cased for case-insensitive parsing; [tokenFor] gives the canonical (original-case)\n'
        sb << ' * token -- the longest XK_ name for a keysym (tie -> first seen), so aliases resolve to the\n'
        sb << ' * descriptive standard name, e.g. 0xFF55 -> "Page_Up" (not "Prior") and 0xFFC8 -> "F11".\n'
        sb << ' */\n'
        sb << 'internal object Keysyms {\n\n'
        entries.each { e -> sb << "    const val XK_${e.name} = 0x${e.hex}L\n" }
        sb << '\n'
        sb << '    /** Lower-cased XK_ token (prefix stripped) -> keysym. */\n'
        sb << '    val byToken: Map<String, Long>\n'
        sb << '    /** keysym -> canonical original-case token (longest XK_ name wins). */\n'
        sb << '    val tokenFor: Map<Long, String>\n\n'
        sb << '    init {\n'
        sb << "        val bt = HashMap<String, Long>($cap)\n"
        sb << "        val tf = HashMap<Long, String>($cap)\n"
        (0..<chunks).each { i -> sb << "        add$i(bt, tf)\n" }
        sb << '        byToken = bt\n'
        sb << '        tokenFor = tf\n'
        sb << '    }\n\n'
        sb << '    private fun add(bt: HashMap<String, Long>, tf: HashMap<Long, String>, name: String, sym: Long) {\n'
        sb << '        bt[name.lowercase()] = sym\n'
        sb << '        val prev = tf[sym]\n'
        sb << '        if (prev == null || name.length > prev.length) tf[sym] = name\n'
        sb << '    }\n'
        entries.eachWithIndex { e, idx ->
            if (idx % chunkSize == 0) {
                if (idx > 0) sb << '    }\n'
                sb << "\n    private fun add${(int) (idx / chunkSize)}(bt: HashMap<String, Long>, tf: HashMap<Long, String>) {\n"
            }
            sb << "        add(bt, tf, \"${e.name}\", XK_${e.name})\n"
        }
        if (!entries.isEmpty()) sb << '    }\n'
        sb << '}\n'
        new File(pkgDir, 'Keysyms.kt').text = sb.toString()
    }
}

def generateKeysyms = tasks.register('generateKeysyms', GenerateKeysyms) {
    keysymHeader.set(rootProject.file('libvncserver/include/rfb/keysym.h'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.kotlin.addGeneratedSourceDirectory(generateKeysyms) { it.getOutputDir() }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.core:core:1.19.0"
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
repositories {
    mavenCentral()
}